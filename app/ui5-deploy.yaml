# Deployment als BSP-Anwendung ins ABAP-Repository (npm run deploy)
specVersion: "3.0"
metadata:
  name: zhr.teamabs
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        ignoreCertError: false
        target:
          url: https://mein-gateway.example.local:44300
          client: "100"
        app:
          name: ZHR_TEAMABS
          description: Team-Abwesenheiten
          package: ZHR_TEAMABS
          transport: DEVK900000
        exclude:
          - /test/
          - /localService/
