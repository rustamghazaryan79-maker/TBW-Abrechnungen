<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Team-Abwesenheiten (Mockdaten)</title>
	<script
		id="sap-ui-bootstrap"
		src="../resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-language="de"
		data-sap-ui-resourceroots='{ "zhr.teamabs": "../" }'
		data-sap-ui-oninit="module:zhr/teamabs/test/initMockServer"
		data-sap-ui-compatVersion="edge"
		data-sap-ui-async="true">
	</script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
	<div
		data-sap-ui-component
		data-name="zhr.teamabs"
		data-id="container"
		data-settings='{"id" : "teamabs"}'
		data-height="100%">
	</div>
</body>
</html>
